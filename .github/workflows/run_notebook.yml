name: Run Jupyter notebook every 6 hours

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_SENDER_PSW: ${{ secrets.EMAIL_SENDER_PSW }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel

      # ---- Secrets validation (FAIL FAST) ----
      - name: Validate required secrets
        run: |
          python - << 'EOF'
          import os, sys
          required = ["EMAIL_USER", "EMAIL_SENDER", "EMAIL_SENDER_PSW"]
          missing = [v for v in required if not os.getenv(v)]
          if missing:
              sys.exit(f"Missing required secrets: {', '.join(missing)}")
          print("All required secrets are present.")
          EOF

      # ---- Execute notebook ----
      - name: Execute main notebook
        run: |
          jupyter nbconvert \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=900 \
            --ExecutePreprocessor.kernel_name=python3 \
            notebooks/main.ipynb \
        working-directory: ${{ github.workspace }}
